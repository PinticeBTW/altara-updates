name: Probe PostgreSQL Windows directory access

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-acl-probe:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.18.0'
      - name: Compare synthetic directory permissions without creating a database
        run: node scripts/protected-native/probe-postgres-windows-acl.cjs
